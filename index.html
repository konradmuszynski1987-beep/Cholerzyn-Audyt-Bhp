<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cholerzyn - Panel Bezpieczeństwa</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111;
  color: white;
  text-align: center;
}

.header {
  background: #222;
  padding: 20px 10px;
  border-bottom: 3px solid #444;
}

.header h1 {
  margin: 0;
  font-size: 28px;
}

.header p {
  margin: 8px 0 0;
  color: #bbb;
  font-size: 15px;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 20px;
}

.status {
  background: #1d1d1d;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 20px;
}

.status-title {
  font-size: 16px;
  color: #aaa;
  margin-bottom: 8px;
}

.stats {
  display: flex;
  justify-content: space-around;
  gap: 10px;
}

.stat {
  flex: 1;
  background: #292929;
  border-radius: 10px;
  padding: 12px;
}

.stat-number {
  font-size: 28px;
  font-weight: bold;
}

.stat-label {
  font-size: 12px;
  color: #aaa;
  margin-top: 4px;
}

button {
  width: 100%;
  border: none;
  border-radius: 15px;
  color: white;
  font-size: 22px;
  font-weight: bold;
  padding: 25px 15px;
  margin: 10px 0;
  cursor: pointer;
}

button:active {
  transform: scale(0.98);
}

.bhp {
  background: #d40000;
}

.fire {
  background: #ff6500;
}

.audit {
  background: #d49b00;
}

.info {
  background: #202020;
  border-radius: 12px;
  padding: 15px;
  margin-top: 20px;
  color: #ccc;
  font-size: 14px;
}

.ack {
  background: #075c2d;
  border-radius: 12px;
  padding: 18px;
  margin-top: 20px;
  display: none;
}

.ack strong {
  font-size: 20px;
}

.footer {
  color: #666;
  font-size: 12px;
  margin-top: 30px;
  padding-bottom: 20px;
}
</style>
</head>

<body>

<div class="header">
  <h1>🚨 CHOLERZYN</h1>
  <p>Panel Bezpieczeństwa</p>
</div>

<div class="container">

  <div class="status">
    <div class="status-title">📊 STATUS KOMUNIKACJI</div>

    <div class="stats">

      <div class="stat">
        <div class="stat-number" id="sentCount">0</div>
        <div class="stat-label">WYSŁANE</div>
      </div>

      <div class="stat">
        <div class="stat-number" id="ackCount">0</div>
        <div class="stat-label">ODEBRANO</div>
      </div>

      <div class="stat">
        <div class="stat-number" id="deviceCount">0</div>
        <div class="stat-label">URZĄDZENIA</div>
      </div>

    </div>
  </div>

  <button class="bhp" onclick="sendBhp()">
    🚨 ALARM BHP
  </button>

  <button class="fire" onclick="sendFire()">
    🔥 UWAGA! POŻAR
  </button>

  <button class="audit" onclick="sendAudit()">
    ⚠️ AUDYT BHP
  </button>

  <div id="ackBox" class="ack">
    <strong>✅ ODEBRANO</strong>
    <br><br>
    Potwierdzenie zostało zapisane.
  </div>

  <div class="info">
    Po wysłaniu komunikatu użytkownik otrzyma powiadomienie
    na urządzeniu Zebra. W powiadomieniu może nacisnąć
    <b>ODEBRANO</b>.
  </div>

  <div class="footer">
    Cholerzyn-Kr2 • Panel Bezpieczeństwa
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const TOPIC = "Cholerzyn-Kr2";

const SUPABASE_URL =
  "https://mleqpnxljfzazcyddolk.supabase.co";


/* =====================================================
   TUTAJ WKLEJ SWÓJ KLUCZ SUPABASE
   ===================================================== */

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_RTR7UsXVJf0RKFC6RRS-Qw_IBdtzKDI";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =====================================================
   IDENTYFIKACJA URZĄDZENIA
   ===================================================== */

function getDeviceId() {

  let id =
    localStorage.getItem("cholerzyn_device_id");

  if (!id) {

    if (
      window.crypto &&
      crypto.randomUUID
    ) {

      id = crypto.randomUUID();

    } else {

      id =
        "device-" +
        Date.now() +
        "-" +
        Math.random()
          .toString(16)
          .substring(2);

    }

    localStorage.setItem(
      "cholerzyn_device_id",
      id
    );
  }

  return id;
}


/* =====================================================
   ID ALARMU
   ===================================================== */

function createEventId() {

  return (
    Date.now().toString(36) +
    "-" +
    Math.random()
      .toString(36)
      .substring(2, 10)
  );

}


/* =====================================================
   ZAPIS WYSŁANEGO ALARMU
   ===================================================== */

async function saveSentEvent(
  eventType,
  eventId
) {

  try {

    await supabaseClient
      .from("feedback_events")
      .insert({

        event_type: eventType,

        device_id: "ADMIN",

        event_id: eventId

      });

    loadStats();

  } catch (error) {

    console.log(
      "Błąd zapisu wysłanego alarmu:",
      error
    );

  }

}


/* =====================================================
   ZAPIS ODEBRANIA
   ===================================================== */

async function saveAcknowledgement(
  eventId
) {

  if (!eventId) {
    return;
  }

  try {

    const deviceId =
      getDeviceId();

    const result =
      await supabaseClient
        .from("feedback_events")
        .insert({

          event_type: "ack",

          device_id: deviceId,

          event_id: eventId

        });

    if (result.error) {

      console.log(
        "Błąd potwierdzenia:",
        result.error
      );

    } else {

      showAck();

      loadStats();

    }

  } catch (error) {

    console.log(
      "Błąd:",
      error
    );

  }

}


/* =====================================================
   SPRAWDZENIE ODEBRANIA
   ===================================================== */

function checkAcknowledgement() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  const eventId =
    params.get("ack");

  if (eventId) {

    saveAcknowledgement(
      eventId
    );

  }

}


/* =====================================================
   POKAZANIE ODEBRANO
   ===================================================== */

function showAck() {

  const box =
    document.getElementById(
      "ackBox"
    );

  if (box) {

    box.style.display =
      "block";

  }

}


/* =====================================================
   STATYSTYKI
   ===================================================== */

async function loadStats() {

  try {

    const result =
      await supabaseClient
        .from("feedback_events")
        .select(
          "event_type,device_id,event_id"
        );

    if (result.error) {

      console.log(
        "Błąd statystyk:",
        result.error
      );

      return;
    }

    const rows =
      result.data || [];


    const sent =
      rows.filter(
        row =>
          row.event_type === "sent"
      );


    const acks =
      rows.filter(
        row =>
          row.event_type === "ack"
      );


    const devices =
      new Set(
        acks
          .map(
            row =>
              row.device_id
          )
          .filter(Boolean)
      );


    document.getElementById(
      "sentCount"
    ).textContent =
      sent.length;


    document.getElementById(
      "ackCount"
    ).textContent =
      acks.length;


    document.getElementById(
      "deviceCount"
    ).textContent =
      devices.size;


  } catch (error) {

    console.log(
      "Błąd ładowania statystyk:",
      error
    );

  }

}


/* =====================================================
   WYSYŁANIE NTFY
   ===================================================== */

let activeRequests = [];


function publish(
  message,
  priority,
  tags,
  eventId
) {

  const ackUrl =
    window.location.origin +
    window.location.pathname +
    "?ack=" +
    encodeURIComponent(
      eventId
    );


  const action =
    "view, ODEBRANO, " +
    ackUrl +
    ", clear=true";


  const url =
    "https://ntfy.sh/" +
    TOPIC +
    "/publish?message=" +
    encodeURIComponent(
      message
    ) +
    "&priority=" +
    priority +
    "&tags=" +
    encodeURIComponent(
      tags
    ) +
    "&actions=" +
    encodeURIComponent(
      action
    ) +
    "&cache=no&cb=" +
    Date.now();


  const img =
    new Image();


  img.onload =
    function() {

      console.log(
        "Komunikat wysłany"
      );

    };


  img.onerror =
    function() {

      console.log(
        "Żądanie wysłane"
      );

    };


  img.src = url;


  activeRequests.push(
    img
  );

}


/* =====================================================
   ALARM BHP
   ===================================================== */

async function sendBhp() {

  const eventId =
    createEventId();


  await saveSentEvent(
    "sent",
    eventId
  );


  publish(
    "🚨 ALARM BHP — NATYCHMIAST SPRAWDŹ KOMUNIKAT",
    5,
    "rotating_light,warning",
    eventId
  );


  setTimeout(
    function() {

      publish(
        "🚨 ALARM BHP — DRUGI SYGNAŁ — PILNE",
        5,
        "rotating_light,warning",
        eventId
      );

    },
    2000
  );


  setTimeout(
    function() {

      publish(
        "🟠 CZY WSZYSCY ODEBRALI ALARM?",
        5,
        "warning",
        eventId
      );

    },
    10000
  );

}


/* =====================================================
   POŻAR
   ===================================================== */

async function sendFire() {

  const eventId =
    createEventId();


  await saveSentEvent(
    "sent",
    eventId
  );


  publish(
    "🔥 UWAGA! POŻAR — SPRAWDŹ KOMUNIKAT",
    4,
    "warning",
    eventId
  );

}


/* =====================================================
   AUDYT BHP
   ===================================================== */

async function sendAudit() {

  const eventId =
    createEventId();


  await saveSentEvent(
    "sent",
    eventId
  );


  publish(
    "⚠️ AUDYT — SPRAWDŹ KOMUNIKAT",
    4,
    "warning",
    eventId
  );

}


/* =====================================================
   START
   ===================================================== */

checkAcknowledgement();

loadStats();

</script>

</body>
</html>
