<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cholerzyn — Audyt BHP</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    text-align: center;
    padding: 25px;
}

h1 {
    font-size: 26px;
    margin-bottom: 40px;
}

button {
    width: 100%;
    max-width: 500px;
    padding: 30px;
    margin: 15px auto;
    border: none;
    border-radius: 15px;
    color: white;
    font-size: 24px;
    font-weight: bold;
    cursor: pointer;
}

.alarm {
    background: #d71920;
}

.audit {
    background: #e67e22;
}

button:active {
    transform: scale(0.97);
}
</style>
</head>

<body>

<h1>🚨 CHOLERZYN — AUDYT BHP</h1>

<button class="alarm" onclick="alarm()">
🚨 ALARM BHP
</button>

<button class="audit" onclick="audit()">
⚠️ PILNE — AUDYT
</button>

<script>

const TOPIC = "Cholerzyn-Kr2";

function send(message, priority, tags) {

    const url =
        "https://ntfy.sh/" + TOPIC +
        "/publish" +
        "?message=" + encodeURIComponent(message) +
        "&priority=" + priority +
        "&tags=" + encodeURIComponent(tags);

    window.location.href = url;
}

function alarm() {

    send(
        "🚨 ALARM BHP — NATYCHMIAST SPRAWDŹ KOMUNIKAT",
        5,
        "rotating_light"
    );

}

function audit() {

    send(
        "⚠️ PILNE — AUDYT BHP",
        4,
        "warning"
    );

}

</script>

</body>
</html>
