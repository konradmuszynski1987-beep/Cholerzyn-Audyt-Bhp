<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cholerzyn — Panel BHP</title>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at 85% 10%, rgba(255, 193, 7, 0.13), transparent 28%),
        linear-gradient(135deg, #f7f8fa 0%, #eef1f4 100%);
    color: #1f2933;
    min-height: 100vh;
}

.container {
    width: 100%;
    max-width: 1100px;
    margin: auto;
    padding: 25px;
}

/* HEADER */

.header {
    background: #ffffff;
    border-radius: 22px;
    padding: 22px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    border: 1px solid #e4e7eb;
}

.brand {
    display: flex;
    align-items: center;
    gap: 16px;
}

.logo {
    width: 58px;
    height: 58px;
    background: #ffcc00;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.12);
}

.header h1 {
    margin: 0;
    font-size: 25px;
    font-weight: 800;
}

.header p {
    margin: 5px 0 0;
    color: #6b7280;
    font-size: 14px;
}

.status {
    background: #ecfdf3;
    color: #16803c;
    padding: 10px 15px;
    border-radius: 30px;
    font-size: 13px;
    font-weight: bold;
    border: 1px solid #b7ebc9;
}

/* HERO */

.hero {
    margin-top: 22px;
    background: #20262d;
    border-radius: 25px;
    min-height: 250px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 15px 40px rgba(0,0,0,0.16);
    color: white;
    padding: 38px;
}

.hero:after {
    content: "";
    position: absolute;
    right: -100px;
    top: -120px;
    width: 360px;
    height: 360px;
    border-radius: 50%;
    background: rgba(255,204,0,0.13);
}

.hero-content {
    position: relative;
    z-index: 2;
    max-width: 650px;
}

.hero h2 {
    font-size: 34px;
    margin: 0 0 12px;
    letter-spacing: -1px;
}

.hero p {
    color: #cbd2d9;
    margin: 0;
    font-size: 16px;
    line-height: 1.5;
}

.mascot {
    position: absolute;
    right: 30px;
    bottom: -10px;
    width: 220px;
    height: 220px;
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: center;
}

    height: 155px;
