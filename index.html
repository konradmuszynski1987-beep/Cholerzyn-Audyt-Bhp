<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEST NTFY</title>
</head>

<body>

<h1>TEST NTFY – CHOLERZYN</h1>

<button onclick="sendTest()">
WYŚLIJ TEST
</button>

<p id="status">Gotowy.</p>

<script>

function sendTest(){

document.getElementById("status").innerText =
"Wysyłanie...";

const url =
"https://ntfy.sh/Cholerzyn-Kr2/publish?message=" +
encodeURIComponent("🔔 TEST Z PANELU — CHOLERZYN") +
"&priority=5" +
"&tags=warning" +
"&cache=no&cb=" +
Date.now();

const img = new Image();

img.onload = function(){

document.getElementById("status").innerText =
"✅ WYSŁANO";

};

img.onerror = function(){

document.getElementById("status").innerText =
"⚠️ Żądanie wysłane";

};

img.src = url;

}

</script>

</body>
</html>
