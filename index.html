<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cholerzyn — Audyt BHP</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    text-align: center;
    padding: 25px;
}

h1 {
    font-size: 26px;
    margin-bottom: 30px;
}

button {
    width: 100%;
    max-width: 500px;
    padding: 25px;
    margin: 12px auto;
    border: none;
    border-radius: 15px;
    color: white;
    font-size: 22px;
    font-weight: bold;
    display: block;
}

.alarm {
    background: #d71920;
}

.important {
    background: #e67e22;
}

.info {
    background: #2878d0;
}

#status {
    margin-top: 25px;
    padding: 15px;
    background: #222;
    border-radius: 10px;
}
</style>
</head>

<body>

<h1>🚨 CHOLERZYN — AUDYT BHP</h1>

<button class="alarm" onclick="sendAlarm()">
🚨 ALARM BHP
</button>

<button class="important" onclick="sendImportant()">
⚠️ WAŻNE
</button>

<button class="info" onclick="sendInfo()">
ℹ️ INFORMACJA
</button>

<div id="status">
Gotowy do wysłania.
</div>

<iframe name="ntfyFrame" style="display:none;"></iframe>

<form id="ntfyForm"
      action="https://ntfy.sh/Cholerzyn-Kr2"
      method="POST"
      target="ntfyFrame"
      style="display:none;">

    <input type="hidden" name="title" value="CHOLERZYN — AUDYT BHP">
    <input type="hidden" name="priority" value="5">
    <input type="hidden" name="tags" value="rotating_light">
    <input type="hidden" name="message" id="message">

</form>

<script>

function send(message, priority, tag) {

    document.getElementById("message").value = message;

    document.getElementById("ntfyForm").priority.value = priority;
    document.getElementById("ntfyForm").tags.value = tag;

    document.getElementById("status").innerText =
        "⏳ Wysyłanie...";

    document.getElementById("ntfyForm").submit();

    setTimeout(function() {
        document.getElementById("status").innerText =
            "✅ Komunikat wysłany";
    }, 1000);
}

function sendAlarm() {
    send(
        "🚨 ALARM BHP — NATYCHMIAST SPRAWDŹ KOMUNIKAT",
        "5",
        "rotating_light"
    );
}

function sendImportant() {
    send(
        "⚠️ WAŻNY KOMUNIKAT BHP",
        "4",
        "warning"
    );
}

function sendInfo() {
    send(
        "ℹ️ INFORMACJA BHP",
        "3",
        "information_source"
    );
}

</script>

</body>
</html>
